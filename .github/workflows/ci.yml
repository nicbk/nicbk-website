# CI gate for every task PR — see research/devops-deployment/ci-pipeline.md.
#
# Security posture (public repo):
# - Trigger is plain `pull_request`, NEVER `pull_request_target`: fork PRs
#   run with a read-only token and no secrets access.
# - All third-party actions are pinned by full commit SHA, not by tag.
# - Zero GitHub-side repository secrets are used (GITHUB_TOKEN below is
#   GitHub's automatic per-run token, not a configured secret).
# - The repo setting "require approval for all outside collaborators" must
#   stay enabled so fork PR workflows don't start without manual approval.
name: CI

# `edited` is included so retitling a PR re-runs the PR-title lint —
# without it a corrected title would leave the failed check stuck red.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  checks:
    name: Biome, typecheck, unit tests
    # GitHub-hosted is the decided end state (free/unlimited for public
    # repos) — see the 2026-07-06 runner-revision addendum in
    # research/devops-deployment/ci-pipeline.md.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only: lets the ratchet step download the coverage-baseline
      # artifact published by the main-branch coverage-baseline.yml run.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome (format + lint, project-wide)
        run: npx biome ci .

      - name: Typecheck
        run: npm run typecheck

      # Enforces "derive, don't hand-type": regenerate the committed GPG
      # artifacts from public/pgp/nicbk.asc and fail if anything differs from
      # what is checked in. ubuntu-latest ships gpg, so no extra install is
      # needed. See features/about-page/tasks/gpg-key-publishing/ and
      # research/security-privacy/gpg-key-publishing.md.
      - name: GPG artifact drift check
        run: |
          node scripts/gen-gpg-artifacts.mjs
          git diff --exit-code -- \
            public/.well-known/openpgpkey \
            src/gpg/fingerprint.generated.ts

      # Same "derive, don't hand-type" rule for the identity schema: which
      # columns Better Auth needs is a property of the library version and the
      # plugins enabled, so src/db/schema/identity.ts is generated. A drift here
      # means the committed schema (and the migrations generated from it) no
      # longer match the auth configuration. See scripts/gen-auth-schema.mjs.
      - name: Auth schema drift check
        run: |
          npm run db:generate-schema
          git diff --exit-code -- src/db/schema/identity.ts

      # And again for the Zero projection: src/zero/schema.gen.ts is derived
      # from the Drizzle schema by drizzle-zero, so a table or column added to
      # Drizzle without regenerating it would leave the sync engine describing a
      # database that no longer exists. See scripts/gen-zero-schema.mjs.
      - name: Zero schema drift check
        run: |
          npm run db:generate-zero-schema
          git diff --exit-code -- src/zero/schema.gen.ts

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Download coverage baseline from main
        env:
          GH_TOKEN: ${{ github.token }}
        # Latest successful main-branch baseline run; a missing baseline is
        # tolerated (bootstrap / expired artifact) — the ratchet script
        # passes with a notice in that case. `|| true`: the workflows API
        # 404s until coverage-baseline.yml exists on main at all.
        run: |
          run_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/coverage-baseline.yml/runs?branch=main&status=success&per_page=1" \
            -q '.workflow_runs[0].id // empty' 2>/dev/null || true)
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name coverage-baseline --dir coverage-baseline \
              || echo "coverage-baseline artifact not found on run $run_id"
          else
            echo "no successful coverage-baseline run on main yet"
          fi

      - name: Coverage ratchet (must not drop below main)
        run: node scripts/coverage-ratchet.mjs coverage/coverage-summary.json coverage-baseline/coverage-summary.json

      - name: Upload coverage HTML report
        # always(): the report is most useful exactly when the ratchet fails.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration:
    name: Integration tests (Testcontainers Postgres + Garage)
    # ubuntu-latest ships a running Docker daemon, which is all Testcontainers
    # needs — see the 2026-07-06 runner addendum in
    # research/testing-qa/integration-testing-strategy.md.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Real Postgres, the real committed migrations, and Better Auth's real
      # HTTP surface; only Google's endpoints are stubbed. Its own job because
      # it needs Docker and runs on a different timescale from the unit tier.
      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: Playwright e2e + axe (production build)
    # GitHub-hosted, same decided arrangement as `checks` above.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts sees CI=true and serves the built production
      # server (npm run build && npm run start) instead of the dev server,
      # so the production serving path is what e2e + axe exercise.
      - name: Playwright e2e (includes axe accessibility checks)
        run: npm run test:e2e

      - name: Upload Playwright traces/report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-auth:
    name: Signed-in e2e (stubbed Google + Postgres + zero-cache + Garage)
    # ubuntu-latest ships a running Docker daemon, which is what the throwaway
    # Postgres and zero-cache need — the same arrangement the integration job
    # relies on. It also supports the `host-gateway` extra host the sync engine
    # uses to call back into the app server running outside the container.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Its own job, separate from `e2e` above, because everything here needs a
      # real session against real services that the rest of the suite should not
      # have to pay for: the OAuth round trip, the account modal it unlocks, and
      # the Lit Tracker, whose whole point is data arriving by sync.
      # scripts/e2e-auth-server.mjs starts Postgres and zero-cache, applies the
      # committed migrations, and serves the production build (CI=true) with
      # Google's token endpoint stubbed.
      - name: Playwright signed-in e2e
        run: npm run test:e2e:auth

      - name: Upload Playwright traces/report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-auth-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  pr-title:
    name: PR title (Conventional Commits)
    # GitHub-hosted, same decided arrangement as `checks` above.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Enforces the Conventional Commits PR-title format — the PR title
      # becomes the squash-merge commit on main. See
      # research/project-management-conventions/commit-message-conventions.md.
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
