# Local-dev override — auto-merged by a plain `docker compose up`, never
# seen by production's explicit `docker compose -f docker-compose.yml up -d`.
# Switches the app to the Dockerfile's `dev` stage with live source and HMR.
services:
  db:
    # Published locally so host-side tooling (psql, drizzle-kit studio, a
    # server started with `npm run dev` outside Docker) can reach the same
    # database the containerized app uses.
    ports:
      - "5432:5432"

  migrate:
    # Same one-shot migration step, from the dev image: the bundled migrator
    # sits at the same absolute path in both stages, and the SQL comes from the
    # bind-mounted checkout, so a migration added on the host applies on the
    # next `docker compose up` without a rebuild.
    build:
      target: dev
    volumes:
      - .:/app
      - /app/node_modules

  garage:
    # Published locally so a server started with `npm run dev` outside Docker —
    # and the integration tests' storage round-trip — reach the same store the
    # containerized app uses. Never published in production, where the app is
    # the only client and reaches it over the internal network.
    ports:
      - "3900:3900"

  garage-init:
    # Same one-shot bootstrap from the dev image; the script sits at the same
    # absolute path in both stages.
    build:
      target: dev
    volumes:
      - .:/app
      - /app/node_modules

  app:
    build:
      target: dev
    volumes:
      # Live source from the host…
      - .:/app
      # …but keep the image's own Linux node_modules (the bind mount above
      # would otherwise shadow it with the host's macOS-built one).
      - /app/node_modules
    environment:
      # Docker bind mounts don't propagate host file-change events into the
      # container, so Vite's watcher needs polling to see edits
      # (research/devops-deployment/hosting-and-infrastructure.md).
      CHOKIDAR_USEPOLLING: "true"
    restart: "no"
