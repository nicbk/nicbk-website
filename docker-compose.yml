# Production Compose file — run explicitly as
# `docker compose -f docker-compose.yml up -d` (the deploy script does this)
# so docker-compose.override.yml is NOT merged in. Running plain
# `docker compose up` locally auto-merges the override for dev/HMR.
# See research/devops-deployment/containerization-and-build.md.
#
# Later features add their services (Garage, GROBID) as siblings under
# `services:`, attached to `app-internal`; the CI runner gets its own separate
# network (research/devops-deployment/ci-pipeline.md).
# The app server and the migration step run the same image: the migrator is a
# bundled script baked into it (see the Dockerfile), so there is one image to
# build, push, and keep in step with the schema it migrates.
x-app-image: &app-image
  build:
    context: .
    target: runner
    args:
      # Interpolated from the project-root .env, like the POSTGRES_* values
      # below. This one is needed at BUILD time rather than run time: Vite
      # inlines VITE_-prefixed variables into the client bundle, so a value
      # supplied only via env_file would never reach the browser. It is public
      # by construction (the browser dials this address itself) — see
      # src/zero/cache-url.ts.
      VITE_ZERO_CACHE_URL: ${VITE_ZERO_CACHE_URL:?set VITE_ZERO_CACHE_URL in .env}

services:
  db:
    # One shared Postgres for every sub-application: identity today, the lit
    # tracker's data later (research/technologies/database.md). Pinned to a
    # patch version so a rebuild can't silently move major versions.
    image: postgres:18.4
    # wal_level=logical is what lets Zero subscribe to changes later. Set now
    # rather than at that point because changing it needs a restart, and the
    # setting is harmless until something subscribes.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      # Compose interpolates these from the same git-ignored .env the app
      # reads; `:?` fails the whole `up` with a named error rather than
      # starting a database with surprise credentials.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # Mounted at /var/lib/postgresql, NOT the /var/lib/postgresql/data path
      # older Postgres images used: from 18 on, the image puts the data
      # directory in a versioned subdirectory of this mount (so `pg_upgrade
      # --link` can work across versions) and refuses to start if it finds data
      # at the old mount point instead.
      - db-data:/var/lib/postgresql
    healthcheck:
      # The app waits on this, so "started" isn't enough — Postgres accepts
      # connections only once initdb and recovery have finished.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-internal

  migrate:
    # Migrations run to completion before the server starts, so the schema is
    # never behind the code querying it, and a failed migration stops the
    # deploy instead of leaving a half-migrated server serving traffic
    # (research/devops-deployment/database-migrations.md). Re-running is a
    # no-op — Drizzle records what it has applied — so every `up` can include
    # it.
    <<: *app-image
    command: ["node", "/usr/local/lib/migrate.mjs"]
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
    # A one-shot job: it exits 0 and stays exited.
    restart: "no"
    networks:
      - app-internal

  app:
    <<: *app-image
    ports:
      - "3000:3000"
    # Host-side, git-ignored secrets/config (manual provisioning per
    # research/devops-deployment/secrets-and-environment-config.md). Now
    # required: src/env.ts fail-fasts at startup without DATABASE_URL, the
    # Better Auth secret/URL, and the Google OAuth credentials.
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-internal

  zero-cache:
    # The sync engine: it replicates Postgres into a SQLite file, serves client
    # queries from it, and calls back into `app` to resolve each query and each
    # write. Single-node — one process doing both replication and view syncing —
    # which is the deployment Rocicorp documents for exactly this scale.
    #
    # Pinned to the same version as the `@rocicorp/zero` package the app builds
    # against. A server is compatible with clients of its own major version and
    # one back, so these two move together deliberately.
    image: rocicorp/zero:1.8.0
    environment:
      # All three connections point at the same database. zero-cache namespaces
      # its client-view-record and change-log data into `zero_0/cvr` and
      # `zero_0/cdc` schemas, so it does not collide with the app's tables, and
      # this is the configuration Rocicorp's own single-node example uses. The
      # upstream connection must be direct — it owns the logical replication
      # slot, which a pooler would break.
      ZERO_UPSTREAM_DB: ${DATABASE_URL:?set DATABASE_URL in .env}
      ZERO_CVR_DB: ${DATABASE_URL:?set DATABASE_URL in .env}
      ZERO_CHANGE_DB: ${DATABASE_URL:?set DATABASE_URL in .env}
      # Only the tables the `zero_data` publication names ever reach the
      # replica; the migration that creates it explains why.
      ZERO_APP_PUBLICATIONS: zero_data
      # On the persisted volume below: losing it costs a full re-replication on
      # the next start, not data.
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:?set ZERO_ADMIN_PASSWORD in .env}
      # Reached over the internal network, so these calls never leave the host.
      ZERO_QUERY_URL: http://app:3000/api/zero/query
      ZERO_MUTATE_URL: http://app:3000/api/zero/mutate
      ZERO_QUERY_API_KEY: ${ZERO_QUERY_API_KEY:?set ZERO_QUERY_API_KEY in .env}
      ZERO_MUTATE_API_KEY: ${ZERO_MUTATE_API_KEY:?set ZERO_MUTATE_API_KEY in .env}
      # Forward the browser's Better Auth cookie to those endpoints — it is how
      # they know who is asking, and the only thing that makes `/query` an
      # authorization boundary rather than an open read of the whole database.
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_MUTATE_FORWARD_COOKIES: "true"
      # Legacy CRUD mutations default to ON. They would let a client write
      # directly, bypassing the mutate endpoint entirely — the one path that is
      # authorized. Explicitly off.
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
    ports:
      # Loopback only. In production the host's Caddy is the sole client — it
      # proxies https://nicbk.com/zero/ straight through to here, leaving the
      # leading path segment in place because zero-cache's own router expects
      # it. Serving the sync engine from the site's own origin (rather than a
      # zero.nicbk.com subdomain) is what lets the browser send its Better Auth
      # session cookie without that cookie having to be widened to every
      # subdomain of the site. Locally the browser reaches this address
      # directly, which works because cookies are keyed by host, not port.
      #
      # Binding 127.0.0.1 rather than 0.0.0.0: Docker's published ports insert
      # their own rules ahead of the host firewall, so an unqualified mapping
      # would expose the sync engine on every interface for no gain.
      - "127.0.0.1:4848:4848"
    volumes:
      - zero-replica:/data
    depends_on:
      db:
        condition: service_healthy
      # The publication and the tables it names are created by a migration, and
      # zero-cache reads both at startup.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4848/keepalive || exit 1"]
      interval: 5s
      timeout: 5s
      # Generous: a first start (or a lost replica) re-replicates the whole
      # publication before the server answers, and failing that is not a crash.
      start_period: 10m
    # Long enough to finish replication work and drain websocket connections
    # rather than being killed mid-flight during a deploy.
    stop_grace_period: 10m
    restart: unless-stopped
    networks:
      - app-internal

volumes:
  db-data:
  zero-replica:

networks:
  app-internal:
